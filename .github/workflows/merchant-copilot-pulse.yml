name: Merchant Copilot Pulse

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: merchant-copilot-pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FNB_PULSE_BASE_URL: ${{ secrets.FNB_PULSE_BASE_URL }}
      FNB_INTERNAL_API_TOKEN: ${{ secrets.FNB_INTERNAL_API_TOKEN }}
    steps:
      - name: Skip when pulse secrets are missing
        if: ${{ env.FNB_PULSE_BASE_URL == '' || env.FNB_INTERNAL_API_TOKEN == '' }}
        run: |
          echo "::notice title=Merchant Copilot Pulse skipped::Configure FNB_PULSE_BASE_URL and FNB_INTERNAL_API_TOKEN in GitHub Actions secrets to enable scheduled pulses."

      - name: Validate pulse configuration
        if: ${{ env.FNB_PULSE_BASE_URL != '' && env.FNB_INTERNAL_API_TOKEN != '' }}
        run: |
          case "$FNB_PULSE_BASE_URL" in
            http://*|https://*) ;;
            *)
              echo "::error title=Invalid FNB_PULSE_BASE_URL::Expected an absolute http(s) URL."
              exit 1
              ;;
          esac

      - name: Trigger merchant copilot pulse
        if: ${{ env.FNB_PULSE_BASE_URL != '' && env.FNB_INTERNAL_API_TOKEN != '' }}
        run: |
          set -euo pipefail
          endpoint="${FNB_PULSE_BASE_URL%/}/api/fnb/ops"
          payload='{"action":"merchant-copilot-complete-next"}'
          response_file="$(mktemp)"
          http_code="$(
            curl -sS \
              --connect-timeout 20 \
              --max-time 60 \
              -o "$response_file" \
              -w '%{http_code}' \
              -X POST "$endpoint" \
              -H 'content-type: application/json' \
              -H "x-fnb-admin-token: ${FNB_INTERNAL_API_TOKEN}" \
              --data "$payload"
          )"

          cat "$response_file"
          echo
          echo "HTTP ${http_code}"

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Merchant Copilot pulse failed."
            exit 1
          fi
